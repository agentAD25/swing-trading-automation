[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Not a connection target. env.py reads SWINGTRADE_TEST_POSTGRES_URL only.
sqlalchemy.url = postgresql+psycopg://invalid.invalid:1/refused

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
