services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: swingtrade
      POSTGRES_USER: swingtrade
      POSTGRES_PASSWORD: swingtrade
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingtrade -d swingtrade"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - swingtrade-postgres:/var/lib/postgresql/data

volumes:
  swingtrade-postgres:
